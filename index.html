<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#0f0f13">
    <title>ELFLIQ_VapeLab — Каталог</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        :root {
            --bg: #0f0f13;
            --bg-card: #17171f;
            --bg-card-hover: #1d1d28;
            --accent: #b06bff;
            --accent-hover: #c48cff;
            --text: #ffffff;
            --text-dim: #9aa0ac;
            --border: rgba(255,255,255,0.08);
            --green: #3ecf8e;
            --price: #ffd34d;
        }
        html { -webkit-text-size-adjust: 100%; }
        body {
            background-color: var(--bg);
            color: var(--text);
            font-family: 'Segoe UI', Roboto, Arial, sans-serif;
            min-height: 100vh;
            padding-bottom: 90px;
        }

        .header {
            padding: 18px 16px 12px;
            text-align: center;
            border-bottom: 1px solid var(--border);
            position: sticky; top: 0;
            background: var(--bg);
            z-index: 10;
        }
        .header h1 {
            font-size: 20px; font-weight: 800; letter-spacing: 0.4px;
            background: linear-gradient(90deg, #b06bff, #4aa3ff, #23d2b5);
            -webkit-background-clip: text; background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .header p { font-size: 12px; color: var(--text-dim); margin-top: 4px; }

        /* ============ КАТЕГОРИИ ============ */
        .categories {
            padding: 14px 12px 4px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }
        .cat-btn {
            background: var(--bg-card);
            border: 2px solid var(--border);
            border-radius: 14px;
            overflow: hidden;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: stretch;
            text-align: left;
            padding: 0;
            transition: background-color 0.15s, border-color 0.15s;
            font-family: inherit;
            color: var(--text);
            -webkit-tap-highlight-color: transparent;
        }
        .cat-btn:active { background: var(--bg-card-hover); }
        .cat-btn.active {
            border-color: var(--accent);
            background: var(--bg-card-hover);
        }
        .cat-btn .cat-img {
            width: 100%;
            aspect-ratio: 16 / 10;
            background: #0a0a0e;
            display: flex; align-items: center; justify-content: center;
            overflow: hidden;
            position: relative;
        }
        .cat-btn .cat-img img {
            width: 100%; height: 100%;
            object-fit: cover;
            display: block;
        }
        .cat-btn .cat-img .ph {
            font-size: 28px; color: #2a2a35; font-weight: 800;
            letter-spacing: 2px; user-select: none;
        }
        .cat-btn .cat-label {
            padding: 10px 12px 12px;
            font-size: 13px;
            font-weight: 700;
            letter-spacing: 0.3px;
            color: var(--text);
            text-align: center;
        }
        .cat-btn.active .cat-label {
            color: var(--accent);
        }

        /* ============ КАТАЛОГ ============ */
        .catalog {
            padding: 14px 12px 20px;
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
        }
        @media (min-width: 520px) { .catalog { grid-template-columns: repeat(3, 1fr); } }
        @media (min-width: 760px) { .catalog { grid-template-columns: repeat(4, 1fr); } }

        .card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 14px;
            overflow: hidden;
            display: flex; flex-direction: column;
            transition: background-color 0.15s;
        }
        .card:active { background: var(--bg-card-hover); }

        .card.out-of-stock .card-img img,
        .card.out-of-stock .card-img .placeholder {
            opacity: 0.35;
            filter: grayscale(1);
        }
        .card.out-of-stock .price { color: #5a5a66; }

        .card .card-img {
            width: 100%; aspect-ratio: 1 / 1;
            background: #ffffff;
            display: flex; align-items: center; justify-content: center;
            overflow: hidden; position: relative;
        }
        .card .card-img img { width: 100%; height: 100%; object-fit: cover; display: block; }
        .card .card-img .placeholder {
            font-size: 40px; color: #d0d0d8; font-weight: 800;
            letter-spacing: 2px; user-select: none;
        }

        .card .card-body {
            padding: 10px 10px 12px;
            display: flex; flex-direction: column; gap: 8px;
            flex: 1 1 auto;
        }
        .card .name {
            font-size: 13px; font-weight: 700; line-height: 1.3;
            word-break: break-word; min-height: 34px;
        }
        .card .stock { font-size: 12px; font-weight: 600; color: var(--green); }
        .card .stock.out { color: #ff6b6b; }

        .card .bottom-row {
            display: flex; align-items: center; justify-content: space-between;
            gap: 8px; margin-top: auto; padding-top: 4px;
        }
        .card .price {
            font-size: 16px; font-weight: 800; color: var(--price);
            letter-spacing: 0.2px; white-space: nowrap;
        }
        .card .price .per {
            font-size: 11px;
            font-weight: 600;
            color: var(--text-dim);
            margin-left: 2px;
        }

        .qty-controls { display: flex; align-items: center; gap: 6px; flex-shrink: 0; }
        .qty-btn {
            width: 36px; height: 36px;
            border: none; background: #1f1f29; color: var(--text);
            font-size: 22px; font-weight: 400; line-height: 1;
            border-radius: 10px; cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            transition: background-color 0.15s, transform 0.1s;
            font-family: inherit; padding: 0;
        }
        .qty-btn:active { background: var(--accent); transform: scale(0.94); }
        .qty-btn.minus { background: #2a2a33; color: #cfcfd6; }
        .qty-btn.minus:active { background: #ff4d6d; color: #fff; }
        .qty-btn.plus.has-qty {
            background: var(--accent); color: #fff;
            font-weight: 700; font-size: 15px;
        }
        .qty-count {
            min-width: 22px; text-align: center;
            font-size: 15px; font-weight: 700; color: var(--text);
        }

        .empty {
            text-align: center; padding: 60px 20px;
            color: var(--text-dim); font-size: 14px; grid-column: 1 / -1;
        }

        .cart-bar {
            position: fixed; left: 0; right: 0; bottom: 0;
            background: #14141b; border-top: 1px solid var(--border);
            padding: 12px 14px calc(12px + env(safe-area-inset-bottom, 0));
            display: flex; align-items: center; gap: 12px; z-index: 20;
        }
        .cart-bar .cart-info {
            flex: 1 1 auto; font-size: 13px; color: var(--text-dim); line-height: 1.3;
        }
        .cart-bar .cart-info b { color: var(--text); font-size: 15px; }
        .cart-bar .cart-info .total-sum { color: var(--price); font-weight: 800; }
        .cart-bar .btn-order {
            flex-shrink: 0; padding: 12px 22px;
            background: var(--accent); color: #fff;
            font-size: 14px; font-weight: 700;
            border: none; border-radius: 12px; cursor: pointer;
            transition: background-color 0.15s; font-family: inherit;
        }
        .cart-bar .btn-order:disabled {
            background: #2a2a33; color: #5a5a66; cursor: not-allowed;
        }
        .cart-bar .btn-order:active:not(:disabled) { background: var(--accent-hover); }

        .toast {
            position: fixed; left: 50%; bottom: 100px;
            transform: translateX(-50%) translateY(20px);
            background: #23d2b5; color: #0a1e1a;
            padding: 10px 18px; border-radius: 10px;
            font-size: 13px; font-weight: 700;
            opacity: 0; pointer-events: none;
            transition: opacity 0.2s, transform 0.2s;
            z-index: 50; max-width: 90vw; text-align: center;
        }
        .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
        .toast.err { background: #ff4d6d; color: #fff; }
    </style>
</head>
<body>
    <div class="header">
        <h1>ELFLIQ_VapeLab</h1>
        <p id="headerSub">Каталог · только жидкости Elfliq</p>
    </div>

    <div class="categories">
        <button class="cat-btn active" data-cat="liquids" id="catLiquids">
            <div class="cat-img">
                <img src="zzh.jpg" alt="Жидкости" onerror="this.style.display='none';this.nextElementSibling.style.display='flex';">

    <div class="toast" id="toast"></div>

    <script>
        var MANAGER_USERNAME = "ELFLIQ_Mng";
        var PAYMENT_METHOD   = "Картой";
        var ORDER_URL        = "https://vpshp.onrender.com/order";
        var STOCK_URL        = "https://vpshp.onrender.com/api/stock";

        // ============================================================
        //  ЦЕНОВЫЕ СЕТКИ (за штуку, зависит от общего кол-ва в корзине)
        //  Жидкости:  1шт → 55 | 2шт → 50 | 5шт → 45 | 10+ → 40
        //  Картриджи: 1-2шт → 30 | 3+ → 25
        // ============================================================
        function pricePerItem(category, qty) {
            if (qty <= 0) return 0;
            if (category === "liquids") {
                if (qty >= 10) return 40;
                if (qty >= 5)  return 45;
                if (qty >= 2)  return 50;
                return 55;
            }
            if (category === "cartridges") {
                if (qty >= 3) return 25;
                return 30;
            }
            return 0;
        }

        // ============================================================
        //  LIQUIDS — жижи
        // ============================================================
        var LIQUIDS = [

            { id: "18", name: "Elflio / Peach ice",                       img: "img/peachice.jpg",                       cat: "liquids" },
            { id: "19", name: "Elflio / Pinacolada",                      img: "img/pinacolada.jpg",                     cat: "liquids" },
            { id: "20", name: "Elflio / Blackberry lemon",                img: "img/blackberrylemon.jpg",                cat: "liquids" },
            { id: "21", name: "Elflio / Pink Grapefruit",                 img: "img/pinkgrapefruit.jpg",                 cat: "liquids" },
            { id: "22", name: "Elflio / Blackcurrant anised (5%)",        img: "img/blackcurrant.jpg",                   cat: "liquids" },

            { id: "100", name: "Elflio / Apple Pear",                     img: "img/ApplePear.jpg",                     cat: "liquids" },
            { id: "101", name: "Elflio / Blueberry Rose Mint",            img: "img/BlueberryRoseMint.jpg",             cat: "liquids" },
            { id: "102", name: "Elflio / Blueberry Sour Raspberry",       img: "img/BlueberrySourRaspberry.jpg",        cat: "liquids" },
            { id: "103", name: "Elflio / Blue Razz",                      img: "img/BlueRazz.jpg",                      cat: "liquids" },
            { id: "104", name: "Elflio / Blue Razz Lemonade",             img: "img/BlueRazzLemonade.jpg",              cat: "liquids" },
            { id: "105", name: "Elflio / Cherry",                         img: "img/Cherry.jpg",                        cat: "liquids" },
            { id: "106", name: "Elflio / Cherry Cola",                    img: "img/CherryCola.jpg",                    cat: "liquids" },
            { id: "107", name: "Elflio / Cool Mint",                      img: "img/CoolMint.jpg",                      cat: "liquids" },

            { id: "112", name: "Elflio / Grape Cherry",                   img: "img/GrapeCherry.jpg",                   cat: "liquids" },
            { id: "113", name: "Elflio / Green Grape Rose",               img: "img/GreenGrapeRose.jpg",                cat: "liquids" },
            { id: "114", name: "Elflio / Jasmine Raspberry",              img: "img/JasmineRaspberry.jpg",              cat: "liquids" },
            { id: "115", name: "Elflio / Kiwi Passion Fruit Guava",       img: "img/KiwiPassionFruitGuava.jpg",         cat: "liquids" },
            { id: "116", name: "Elflio / Ocean Mint",                     img: "img/OceanMint.jpg",                     cat: "liquids" },
            { id: "117", name: "Elflio / P&B Cloudd",                     img: "img/PBCloudd.jpg",                      cat: "liquids" },
            { id: "118", name: "Elflio / Pineapple Colada",               img: "img/PineappleColada.jpg",               cat: "liquids" },
            { id: "119", name: "Elflio / Pink Lemonade",                  img: "img/PinkLemonade.jpg",                  cat: "liquids" },
            { id: "120", name: "Elflio / Pink Lemonade Soda",             img: "img/PinkLemonadeSoda.jpg",              cat: "liquids" },
            { id: "121", name: "Elflio / Raspberry Lychee",               img: "img/RaspberryLychee.jpg",               cat: "liquids" },
            { id: "122", name: "Elflio / Rhubarb Snoow",                  img: "img/RhubarbSnoow.jpg",                  cat: "liquids" },
            { id: "123", name: "Elflio / Snoow Tobacco",                  img: "img/SnoowTobacco.jpg",                  cat: "liquids" },
            { id: "124", name: "Elflio / Sour Watermelon Gummy",          img: "img/SourWatermelonGummy.jpg",           cat: "liquids" },
            { id: "125", name: "Elflio / Spearmint",                      img: "img/Spearmint.jpg",                     cat: "liquids" },
            { id: "126", name: "Elflio / Strawberry Cherry Lemon",        img: "img/StrawberryCherryLemon.jpg",         cat: "liquids" },
            { id: "127", name: "Elflio / Strawberry Ice",                 img: "img/StrawberryIce.jpg",                 cat: "liquids" },
            { id: "128", name: "Elflio / Strawberry Kiwi",                img: "img/StrawberryKiwi.jpg",                cat: "liquids" },
            { id: "129", name: "Elflio / Strawberry Raspberry Cherry Ice",img: "img/StrawberryRaspberryCherryIce.jpg",  cat: "liquids" },
            { id: "130", name: "Elflio / Strawberry Snoow",               img: "img/StrawberrySnoow.jpg",               cat: "liquids" },
            { id: "131", name: "Elflio / Watermelon",                     img: "img/Watermelon.jpg",                    cat: "liquids" },
            { id: "132", name: "Elflio / Watermelon Cherry",              img: "img/WatermelonCherry.jpg",              cat: "liquids" },
        ];

        var CARTRIDGES = [
            { id: "200", name: "Xros 0,4 om",     img: "img/xross.jpg", cat: "cartridges" },
            { id: "201", name: "OXVA xlim 0,6 om", img: "img/oxva.jpg",  cat: "cartridges" },
        ];

        // ============================================================
        //  STATE
        // ============================================================
        var currentCategory = "liquids";
        var cart = {};
        var STOCK_QTY = {};

        var tg = window.Telegram && window.Telegram.WebApp ? window.Telegram.WebApp : null;
        if (tg) {
            tg.ready(); tg.expand();
            try { tg.setHeaderColor("#0f0f13"); } catch (e) {}
            try { tg.setBackgroundColor("#0f0f13"); } catch (e) {}
        }

        function esc(s) {
            return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#39;");
        }
        function fmtPrice(n) { return Number(n).toFixed(2) + " zł"; }

        function getActiveCatalog() {
            return currentCategory === "liquids" ? LIQUIDS : CARTRIDGES;
        }
        function getItemById(id) {
            var list = LIQUIDS.concat(CARTRIDGES);
            for (var i = 0; i < list.length; i++) {
                if (list[i].id === id) return list[i];
            }
            return null;
        }

        // Считаем, сколько всего штук в корзине по каждой категории
        function cartCountByCat(cat) {
            var total = 0;
            Object.keys(cart).forEach(function (k) {
                var item = getItemById(k);
                if (item && item.cat === cat) total += cart[k];
            });
            return total;
        }

        // Итоговая цена всей корзины (с учётом сеток)
        function cartTotal() {
            var liquidsQty    = cartCountByCat("liquids");
            var cartridgesQty = cartCountByCat("cartridges");
            var lp = pricePerItem("liquids", liquidsQty);
            var cp = pricePerItem("cartridges", cartridgesQty);
            return liquidsQty * lp + cartridgesQty * cp;
        }

        // Сколько сейчас стоит 1 шт этой категории (по текущему кол-ву в корзине)
        function currentUnitPrice(cat) {
            return pricePerItem(cat, cartCountByCat(cat));
        }

        function loadStockQty() {
            return fetch(STOCK_URL, { cache: "no-store" })
                .then(function (r) { return r.json(); })
                .then(function (data) {
                    STOCK_QTY = data || {};
                    refresh();
                })
                .catch(function () {});
        }

        function setCategory(cat) {
            currentCategory = cat;
            document.querySelectorAll(".cat-btn").forEach(function (btn) {
                btn.classList.toggle("active", btn.dataset.cat === cat);
            });
            var sub = document.getElementById("headerSub");
            if (cat === "liquids") {
                sub.textContent = "Каталог · только жидкости Elfliq";
            } else {
                sub.textContent = "Каталог · картриджи";
            }
            refresh();
        }

        document.querySelectorAll(".cat-btn").forEach(function (btn) {
            btn.addEventListener("click", function () {
                setCategory(btn.dataset.cat);
                if (tg) { try { tg.HapticFeedback.selectionChanged(); } catch (e) {} }
            });
        });

        function renderCatalog() {
            var box = document.getElementById("catalog");
            box.innerHTML = "";

            var list = getActiveCatalog();
            var unitPrice = currentUnitPrice(currentCategory);
            var cartQty = cartCountByCat(currentCategory);

            if (!list.length) {
                var emptyDiv = document.createElement("div");
                emptyDiv.className = "empty";
                emptyDiv.textContent = "В этой категории пока ничего нет.";
                box.appendChild(emptyDiv);
                return;
            }

            list.forEach(function (item) {
                var stockQty = STOCK_QTY[item.id];
                var inStock  = (stockQty === undefined) ? true : (stockQty > 0);

                if (!inStock && cart[item.id]) {
                    delete cart[item.id];
                }

                var qty = cart[item.id] || 0;

                var imgHtml;
                if (item.img && item.img.length > 0) {
                    imgHtml = '<img src="' + esc(item.img) + '" alt="' + esc(item.name) + '" loading="lazy" onerror="this.style.display=\'none\';this.nextElementSibling.style.display=\'flex\';"><div class="placeholder" style="display:none;">' + esc(item.id) + '</div>';
                } else {
                    imgHtml = '<div class="placeholder">' + esc(item.id) + '</div>';
                }

                var stockHtml = inStock
                    ? '<div class="stock">В наличии</div>'
                    : '<div class="stock out">Не в наличии</div>';

                var controlsHtml = "";
                if (inStock) {
                    var canAddMore = (stockQty === undefined) || (qty < stockQty);
                    if (qty === 0) {
                        controlsHtml = canAddMore
                            ? '<button class="qty-btn plus" data-act="inc" data-id="' + esc(item.id) + '">+</button>'
                            : '';
                    } else {
                        controlsHtml =
                            '<button class="qty-btn minus" data-act="dec" data-id="' + esc(item.id) + '">−</button>' +
                            '<div class="qty-count">' + qty + '</div>' +
                            (canAddMore
                                ? '<button class="qty-btn plus has-qty" data-act="inc" data-id="' + esc(item.id) + '">+</button>'
                                : '');
                    }
                }

                // Отображаем цену за штуку при текущем количестве в корзине
                var priceLine = unitPrice + ' zł<span class="per">/шт</span>';

                var card = document.createElement("div");
                card.className = "card" + (inStock ? "" : " out-of-stock");
                card.innerHTML =
                    '<div class="card-img">' + imgHtml + '</div>' +
                    '<div class="card-body">' +
                        '<div class="name">' + esc(item.name) + '</div>' +
                        stockHtml +
                        '<div class="bottom-row">' +
                            '<div class="price">' + priceLine + '</div>' +
                            '<div class="qty-controls">' + controlsHtml + '</div>' +
                        '</div>' +
                    '</div>';
                box.appendChild(card);
            });
        }

        function renderCartBar() {
            var totalItems = 0;
            Object.keys(cart).forEach(function (k) { totalItems += cart[k]; });
            var totalSum = cartTotal();

            var info = document.getElementById("cartInfo");
            var btn = document.getElementById("btnOrder");

            if (totalItems === 0) {
                info.innerHTML = "Корзина пуста";
                btn.disabled = true;
            } else {
                info.innerHTML = "В корзине: <b>" + totalItems + "</b> шт · <span class=\"total-sum\">" + fmtPrice(totalSum) + "</span>";
                btn.disabled = false;
            }
        }

        function refresh() { renderCatalog(); renderCartBar(); }

        document.addEventListener("click", function (e) {
            var t = e.target;
            if (!t.dataset || !t.dataset.act) return;
            var id = t.dataset.id, act = t.dataset.act;
            var current = cart[id] || 0;
            var stockQty = STOCK_QTY[id];

            if (act === "inc") {
                if (stockQty !== undefined && current >= stockQty) {
                    showToast("Больше нет в наличии", true);
                    return;
                }
                cart[id] = current + 1;
            } else if (act === "dec") {
                if (current > 0) {
                    cart[id] = current - 1;
                    if (cart[id] <= 0) delete cart[id];
                }
            }
            refresh();
            if (tg) { try { tg.HapticFeedback.selectionChanged(); } catch (e) {} }
        });

        document.getElementById("btnOrder").addEventListener("click", sendOrder);

        function sendOrder() {
            var lines = [], items = [], totalSum = 0;

            var liquidsQty    = cartCountByCat("liquids");
            var cartridgesQty = cartCountByCat("cartridges");
            var lp = pricePerItem("liquids", liquidsQty);
            var cp = pricePerItem("cartridges", cartridgesQty);

            Object.keys(cart).forEach(function (k) {
                var qty = cart[k] || 0;
                if (qty <= 0) return;
                var item = getItemById(k);
                if (!item) return;
                var unit = (item.cat === "liquids") ? lp : cp;
                var sum = unit * qty;
                totalSum += sum;
                lines.push(item.name + " × " + qty + " × " + unit + " zł = " + fmtPrice(sum));
                items.push({ id: item.id, name: item.name, qty: qty, price: unit, sum: sum });
            });

            if (!items.length) { showToast("Корзина пуста"); return; }

            var message =
                "Заказ\n\n" +
                lines.join("\n") + "\n\n" +
                "Оплата: " + PAYMENT_METHOD + "\n" +
                "Итого: " + fmtPrice(totalSum);

            var payload = {
                name: (tg && tg.initDataUnsafe && tg.initDataUnsafe.user
                    ? ((tg.initDataUnsafe.user.first_name || "") + " " + (tg.initDataUnsafe.user.last_name || "")).trim()
                    : "Гость"),
                contact: (tg && tg.initDataUnsafe && tg.initDataUnsafe.user && tg.initDataUnsafe.user.username
                    ? "@" + tg.initDataUnsafe.user.username : "—"),
                comment: PAYMENT_METHOD,
                items: items,
                total: totalSum,
                tg_user: tg && tg.initDataUnsafe && tg.initDataUnsafe.user
                    ? (tg.initDataUnsafe.user.username
                        ? "@" + tg.initDataUnsafe.user.username
                        : (tg.initDataUnsafe.user.first_name || "") + " " + (tg.initDataUnsafe.user.last_name || ""))
                    : "",
                tg_id: tg && tg.initDataUnsafe && tg.initDataUnsafe.user
                    ? tg.initDataUnsafe.user.id : null
            };

            var btn = document.getElementById("btnOrder");
            btn.disabled = true;
            btn.textContent = "Отправка…";

            fetch(ORDER_URL, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(payload)
            })
            .then(function (r) { return r.json(); })
            .then(function (res) {
                if (!res || !res.ok) {
                    showToast(res && res.error ? "Ошибка: " + res.error : "Ошибка отправки", true);
                    btn.disabled = false;
                    btn.textContent = "Заказать";
                    loadStockQty();
                    return;
                }

                var url = "https://t.me/" + MANAGER_USERNAME + "?text=" + encodeURIComponent(message);
                if (tg) {
                    try { tg.openTelegramLink(url); } catch (e) { window.open(url, "_blank"); }
                } else {
                    window.open(url, "_blank");
                }

                cart = {};
                refresh();
                btn.disabled = false;
                btn.textContent = "Заказать";
                showToast("Заказ отправлен!");
                loadStockQty();
            })
            .catch(function () {
                showToast("Ошибка соединения", true);
                btn.disabled = false;
                btn.textContent = "Заказать";
            });
        }

        var toastTimer = null;
        function showToast(msg, isErr) {
            var t = document.getElementById("toast");
            t.textContent = msg;
            t.classList.toggle("err", !!isErr);
            t.classList.add("show");
            if (toastTimer) clearTimeout(toastTimer);
            toastTimer = setTimeout(function () { t.classList.remove("show"); }, 2500);
        }

        setCategory("liquids");
        loadStockQty();
        setInterval(loadStockQty, 10000);
    </script>
</body>
</html>
