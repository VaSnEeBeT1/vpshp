<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Stock Admin</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        :root {
            --bg: #0f0f13;
            --card: #17171f;
            --card-hover: #1d1d28;
            --accent: #b06bff;
            --text: #fff;
            --text-dim: #9aa0ac;
            --border: rgba(255,255,255,0.08);
            --green: #3ecf8e;
            --red: #ff6b6b;
        }
        body {
            background: var(--bg); color: var(--text);
            font-family: 'Segoe UI', Roboto, Arial, sans-serif;
            min-height: 100vh; padding: 20px 14px 40px;
        }
        h1 {
            font-size: 20px; font-weight: 800; margin-bottom: 6px;
            background: linear-gradient(90deg, #b06bff, #4aa3ff, #23d2b5);
            -webkit-background-clip: text; background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .sub { font-size: 12px; color: var(--text-dim); margin-bottom: 18px; }
        .toolbar { display: flex; gap: 10px; margin-bottom: 18px; flex-wrap: wrap; }
        .toolbar button {
            padding: 10px 16px; background: var(--card);
            border: 1px solid var(--border); color: var(--text);
            border-radius: 10px; font-size: 13px; font-weight: 700;
            cursor: pointer; font-family: inherit;
        }
        .toolbar button:hover { background: var(--card-hover); }
        .toolbar button.danger { color: var(--red); }

        .grid {
            display: grid; grid-template-columns: 1fr;
            gap: 10px; max-width: 900px; margin: 0 auto;
        }
        .row {
            background: var(--card); border: 1px solid var(--border);
            border-radius: 12px; padding: 12px 14px;
            display: flex; align-items: center; gap: 12px;
        }
        .row .img {
            width: 56px; height: 56px; flex-shrink: 0;
            background: #fff; border-radius: 8px;
            overflow: hidden; display: flex;
            align-items: center; justify-content: center;
        }
        .row .img img { width: 100%; height: 100%; object-fit: cover; display: block; }
        .row .img .ph { font-size: 20px; color: #ccc; font-weight: 800; }
        .row .info { flex: 1 1 auto; min-width: 0; }
        .row .info .name {
            font-size: 13.5px; font-weight: 700;
            line-height: 1.3; word-break: break-word;
        }
        .row .info .id { font-size: 11px; color: var(--text-dim); margin-top: 3px; }
        .row .controls {
            display: flex; align-items: center; gap: 6px; flex-shrink: 0;
        }
        .row .controls button {
            width: 34px; height: 34px; border: none;
            background: #1f1f29; color: var(--text);
            font-size: 18px; font-weight: 700;
            border-radius: 9px; cursor: pointer;
            font-family: inherit; transition: background 0.15s;
        }
        .row .controls button:hover { background: var(--accent); }
        .row .controls button.minus:hover { background: var(--red); }
        .row .controls input {
            width: 60px; height: 34px; text-align: center;
            background: #0f0f13; border: 1px solid var(--border);
            color: var(--text); border-radius: 9px;
            font-size: 14px; font-weight: 700;
            font-family: inherit; outline: none;
        }
        .row .controls input:focus { border-color: var(--accent); }

        .status {
            font-size: 11px; font-weight: 700;
            padding: 3px 8px; border-radius: 6px;
            margin-left: 8px; white-space: nowrap;
        }
        .status.in  { background: rgba(62,207,142,0.15); color: var(--green); }
        .status.out { background: rgba(255,107,107,0.15); color: var(--red); }

        .toast {
            position: fixed; left: 50%; bottom: 30px;
            transform: translateX(-50%) translateY(20px);
            background: var(--green); color: #0a1e1a;
            padding: 10px 18px; border-radius: 10px;
            font-size: 13px; font-weight: 700;
            opacity: 0; pointer-events: none;
            transition: opacity 0.2s, transform 0.2s; z-index: 50;
        }
        .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
        .toast.err  { background: var(--red); color: #fff; }

        .errbox {
            max-width: 900px; margin: 0 auto 16px;
            background: rgba(255,107,107,0.15);
            border: 1px solid rgba(255,107,107,0.4);
            color: #ffb3b3;
            padding: 12px 14px; border-radius: 10px;
            font-size: 13px; line-height: 1.5;
            display: none;
        }
        .errbox.show { display: block; }
        .errbox code { color: #fff; background: rgba(0,0,0,0.3); padding: 1px 6px; border-radius: 4px; }
    </style>
</head>
<body>
    <h1>Stock Admin</h1>
    <div class="sub">Управление количеством · изменения сразу идут на сайт</div>

    <div class="toolbar">
        <button onclick="loadStock()">🔄 Обновить</button>
        <button class="danger" onclick="zeroAll()">🗑 Обнулить всё</button>
    </div>

    <div class="errbox" id="errbox"></div>

    <div class="grid" id="grid">
        <div style="text-align:center;padding:40px;color:#9aa0ac;">Загрузка…</div>
    </div>

    <div class="toast" id="toast"></div>

    <script>
        var KEY = new URLSearchParams(location.search).get("key") || "";
        var STOCK = {};
        var CATALOG = [
            { id: "2",  name: "Elflio / Strawberry Banana",               img: "img/strawberrybanana.jpg" },
            { id: "3",  name: "Elflio / Cherry Lemon Peach",              img: "img/cherrylemonpeach.jpg" },
            { id: "4",  name: "Elflio / Blueberry Raspberry Pomegranate", img: "img/blueberryraspberrypomegranate.jpg" },
            { id: "6",  name: "Elflio / Raspberry Lychee",                img: "img/raspberrylychee.jpg" },
            { id: "7",  name: "Elflio / Pineapple Ice",                   img: "img/pineappleice.jpg" },
            { id: "8",  name: "Elflio / Lemon Lime",                      img: "img/lemonlime.jpg" },
            { id: "10", name: "Elflio / Blueberry",                       img: "img/blueberry.jpg" },
            { id: "12", name: "Elflio / Sour apple",                      img: "img/sourapple.jpg" },
            { id: "13", name: "Elflio / Grape",                           img: "img/grape.jpg" },
            { id: "16", name: "Elflio / Apple peach",                     img: "img/applepeach.jpg" },
            { id: "17", name: "Elflio / Cola",                            img: "img/cola.jpg" },
            { id: "18", name: "Elflio / Peach ice",                       img: "img/peachice.jpg" },
            { id: "19", name: "Elflio / Pinacolada",                      img: "img/pinacolada.jpg" },
            { id: "20", name: "Elflio / Blackberry lemon",                img: "img/blackberrylemon.jpg" },
            { id: "21", name: "Elflio / Pink Grapefruit",                 img: "img/pinkgrapefruit.jpg" },
            { id: "22", name: "Elflio / Blackcurrant anised (5%)",        img: "img/blackcurrant.jpg" },
        ];

        function esc(s) {
            return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
        }

        function showErr(msg) {
            var box = document.getElementById("errbox");
            box.innerHTML = msg;
            box.classList.add("show");
        }
        function hideErr() { document.getElementById("errbox").classList.remove("show"); }

        function loadStock() {
            if (!KEY) {
                showErr("❌ Ключ не указан в URL. Открой админку так: <code>/admin?key=ТВОЙ_КЛЮЧ</code>");
                return;
            }
            hideErr();
            fetch("/admin/api/stock?key=" + encodeURIComponent(KEY), { cache: "no-store" })
                .then(function (r) {
                    if (r.status === 403) {
                        showErr("❌ Неверный ключ. Проверь <code>ADMIN_KEY</code> в <code>bot.py</code> и параметр <code>?key=</code> в URL.");
                        throw new Error("forbidden");
                    }
                    if (r.status === 404) {
                        showErr("❌ Страница не найдена. Убедись, что открыл <code>/admin</code>, а не файл с диска.");
                        throw new Error("notfound");
                    }
                    return r.json();
                })
                .then(function (res) {
                    if (!res.ok) { showErr("Ошибка: " + (res.error || "unknown")); return; }
                    STOCK = res.stock;
                    render();
                })
                .catch(function (e) {
                    if (e.message !== "forbidden" && e.message !== "notfound") {
                        showErr("❌ Не удалось соединиться с сервером. Запущен ли <code>python bot.py</code>? Открываешь ли через <code>http://localhost:8080/...</code>?");
                    }
                });
        }

        function render() {
            var box = document.getElementById("grid");
            box.innerHTML = "";

            CATALOG.forEach(function (item) {
                var qty = (STOCK[item.id] && STOCK[item.id].qty) || 0;
                var inStock = qty > 0;

                var imgHtml = item.img
                    ? '<img src="' + esc(item.img) + '" alt="" onerror="this.style.display=\'none\';this.nextElementSibling.style.display=\'flex\';"><div class="ph" style="display:none;">' + esc(item.id) + '</div>'
                    : '<div class="ph">' + esc(item.id) + '</div>';

                var statusHtml = inStock
                    ? '<span class="status in">В наличии</span>'
                    : '<span class="status out">Не в наличии</span>';

                var row = document.createElement("div");
                row.className = "row";
                row.innerHTML =
                    '<div class="img">' + imgHtml + '</div>' +
                    '<div class="info">' +
                        '<div class="name">' + esc(item.name) + '</div>' +
                        '<div class="id">ID: ' + esc(item.id) + statusHtml + '</div>' +
                    '</div>' +
                    '<div class="controls">' +
                        '<button class="minus" data-act="dec" data-id="' + esc(item.id) + '">−</button>' +
                        '<input type="number" min="0" value="' + qty + '" data-id="' + esc(item.id) + '">' +
                        '<button data-act="inc" data-id="' + esc(item.id) + '">+</button>' +
                    '</div>';
                box.appendChild(row);
            });
        }

        document.addEventListener("click", function (e) {
            var t = e.target;
            if (!t.dataset || !t.dataset.act) return;
            var id = t.dataset.id, act = t.dataset.act;
            var current = (STOCK[id] && STOCK[id].qty) || 0;
            var next = act === "inc" ? current + 1 : Math.max(0, current - 1);
            setQty(id, next);
        });

        document.addEventListener("change", function (e) {
            var t = e.target;
            if (t.tagName !== "INPUT" || !t.dataset.id) return;
            var v = parseInt(t.value, 10);
            if (isNaN(v) || v < 0) v = 0;
            setQty(t.dataset.id, v);
        });

        function setQty(id, qty) {
            fetch("/admin/api/stock?key=" + encodeURIComponent(KEY), {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ id: id, qty: qty })
            })
            .then(function (r) { return r.json(); })
            .then(function (res) {
                if (res.ok) {
                    if (!STOCK[id]) STOCK[id] = {};
                    STOCK[id].qty = res.qty;
                    render();
                    showToast(id + " → " + res.qty);
                } else {
                    showToast("Ошибка: " + (res.error || ""), true);
                }
            })
            .catch(function () { showToast("Ошибка сети", true); });
        }

        function zeroAll() {
            if (!confirm("Обнулить количество у ВСЕХ позиций?")) return;
            var ids = CATALOG.map(function (x) { return x.id; });
            Promise.all(ids.map(function (id) {
                return fetch("/admin/api/stock?key=" + encodeURIComponent(KEY), {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ id: id, qty: 0 })
                });
            })).then(function () {
                loadStock();
                showToast("Всё обнулено");
            });
        }

        var toastTimer = null;
        function showToast(msg, isErr) {
            var t = document.getElementById("toast");
            t.textContent = msg;
            t.classList.toggle("err", !!isErr);
            t.classList.add("show");
            if (toastTimer) clearTimeout(toastTimer);
            toastTimer = setTimeout(function () { t.classList.remove("show"); }, 1800);
        }

        loadStock();
    </script>
</body>
</html>
